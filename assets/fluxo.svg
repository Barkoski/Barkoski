<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Como eu trabalho: documento, prova, estratégia, ferramenta e revisão humana">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#101a2c"/><stop offset="1" stop-color="#2a2148"/></linearGradient>
    <style>
      .t{font-family:'Segoe UI',Inter,Arial,sans-serif}
      @keyframes dash{to{stroke-dashoffset:-24}}
      .flow{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
    </style>
  </defs>
  <rect width="1200" height="230" rx="22" fill="url(#bg)"/>
  <text x="600" y="44" class="t" font-size="16" font-weight="700" letter-spacing="3" fill="#f3d58f" text-anchor="middle">COMO EU TRABALHO</text>
  <g stroke="#f3d58f" stroke-opacity=".7" stroke-width="3" fill="none" class="flow">
    <path d="M222 128H262M442 128H482M662 128H702M882 128H922"/>
  </g>
  <g class="t" text-anchor="middle">
    <g><rect x="62" y="78" width="160" height="100" rx="18" fill="#638b83"/><text x="142" y="122" font-size="30">📄</text><text x="142" y="158" font-size="18" font-weight="700" fill="#fff">Documento</text></g>
    <g><rect x="282" y="78" width="160" height="100" rx="18" fill="#617da0"/><text x="362" y="122" font-size="30">🔍</text><text x="362" y="158" font-size="18" font-weight="700" fill="#fff">Prova</text></g>
    <g><rect x="502" y="78" width="160" height="100" rx="18" fill="#74839b"/><text x="582" y="122" font-size="30">🧭</text><text x="582" y="158" font-size="18" font-weight="700" fill="#fff">Estratégia</text></g>
    <g><rect x="722" y="78" width="160" height="100" rx="18" fill="#8a6fb0"/><text x="802" y="122" font-size="30">🤖</text><text x="802" y="158" font-size="18" font-weight="700" fill="#fff">Ferramenta</text></g>
    <g><rect x="942" y="78" width="196" height="100" rx="18" fill="#c9973f"/><text x="1040" y="122" font-size="30">🧑‍⚖️</text><text x="1040" y="158" font-size="18" font-weight="700" fill="#fff">Revisão humana</text></g>
    <text x="600" y="210" font-size="15" fill="#c9d4e8">A IA organiza e sugere. Quem assina a peça é o advogado.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Documento → Prova → Estratégia → Ferramenta → Revisão humana">
 <defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1e3d"/><stop offset=".6" stop-color="#0f2547"/><stop offset="1" stop-color="#1a1f45"/></linearGradient>
 <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f1d79c" stop-opacity=".22"/><stop offset="1" stop-color="#f1d79c" stop-opacity="0"/></radialGradient>
 <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".05"/></pattern>
 <style>
 .serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:'Segoe UI',Inter,Arial,sans-serif}.mono{font-family:Consolas,'Cascadia Code',monospace}
 @keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.beam{animation:swing 7s ease-in-out infinite}
 @keyframes dash{to{stroke-dashoffset:-24}}.flow{animation:dash 1.4s linear infinite}
 @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{animation:blink 1.1s steps(1) infinite}
</style></defs>
 <rect width="1200" height="220" rx="24" fill="url(#bg)"/><rect width="1200" height="220" rx="24" fill="url(#dots)"/>
 <rect x="1" y="1" width="1198" height="218" rx="23" fill="none" stroke="#d9b26a" stroke-opacity=".28"/>
 <g class="sans"><path d="M64 44h28" stroke="#d9b26a" stroke-width="2"/><text x="102" y="50" font-size="14" font-weight="600" letter-spacing="3" fill="#d9b26a">COMO EU TRABALHO</text></g>
 <rect x="64" y="70" width="182" height="86" rx="16" fill="#d9b26a" fill-opacity=".07" stroke="#d9b26a" stroke-opacity=".45"/>
   <text x="86" y="104" class="serif" font-size="22" font-weight="700" fill="#d9b26a">01</text>
   <text x="86" y="138" class="sans" font-size="18" font-weight="600" fill="#e9eef7">Documento</text><path d="M252 113H278" stroke="#d9b26a" stroke-width="2.4" stroke-dasharray="5 5" class="flow"/><path d="M272 107l7 6-7 6" fill="none" stroke="#d9b26a" stroke-width="2.4" stroke-linecap="round"/><rect x="286" y="70" width="182" height="86" rx="16" fill="#d9b26a" fill-opacity=".07" stroke="#d9b26a" stroke-opacity=".45"/>
   <text x="308" y="104" class="serif" font-size="22" font-weight="700" fill="#d9b26a">02</text>
   <text x="308" y="138" class="sans" font-size="18" font-weight="600" fill="#e9eef7">Prova</text><path d="M474 113H500" stroke="#d9b26a" stroke-width="2.4" stroke-dasharray="5 5" class="flow"/><path d="M494 107l7 6-7 6" fill="none" stroke="#d9b26a" stroke-width="2.4" stroke-linecap="round"/><rect x="508" y="70" width="182" height="86" rx="16" fill="#d9b26a" fill-opacity=".07" stroke="#d9b26a" stroke-opacity=".45"/>
   <text x="530" y="104" class="serif" font-size="22" font-weight="700" fill="#d9b26a">03</text>
   <text x="530" y="138" class="sans" font-size="18" font-weight="600" fill="#e9eef7">Estratégia</text><path d="M696 113H722" stroke="#d9b26a" stroke-width="2.4" stroke-dasharray="5 5" class="flow"/><path d="M716 107l7 6-7 6" fill="none" stroke="#d9b26a" stroke-width="2.4" stroke-linecap="round"/><rect x="730" y="70" width="182" height="86" rx="16" fill="#d9b26a" fill-opacity=".07" stroke="#d9b26a" stroke-opacity=".45"/>
   <text x="752" y="104" class="serif" font-size="22" font-weight="700" fill="#d9b26a">04</text>
   <text x="752" y="138" class="sans" font-size="18" font-weight="600" fill="#e9eef7">Ferramenta</text><path d="M918 113H944" stroke="#d9b26a" stroke-width="2.4" stroke-dasharray="5 5" class="flow"/><path d="M938 107l7 6-7 6" fill="none" stroke="#d9b26a" stroke-width="2.4" stroke-linecap="round"/><rect x="952" y="70" width="182" height="86" rx="16" fill="#d9b26a" fill-opacity=".07" stroke="#d9b26a" stroke-opacity=".45"/>
   <text x="974" y="104" class="serif" font-size="22" font-weight="700" fill="#d9b26a">05</text>
   <text x="974" y="138" class="sans" font-size="18" font-weight="600" fill="#e9eef7">Revisão humana</text>
 <text x="64" y="192" class="sans" font-size="15" fill="#a9b6cc">A IA organiza e sugere. Quem assina a peça é o advogado.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Lucas Barkoski: advogado previdenciarista e metido a dev nas horas vagas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2c"/><stop offset=".55" stop-color="#1b2a45"/><stop offset="1" stop-color="#2a2148"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d58f"/><stop offset="1" stop-color="#c9973f"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f3d58f" stop-opacity=".35"/><stop offset="1" stop-color="#f3d58f" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t{font-family:'Segoe UI',Inter,Arial,sans-serif}
      .mono{font-family:Consolas,'Cascadia Code','Courier New',monospace}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      @keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      .cur{animation:blink 1.1s steps(1) infinite}
      .beam{animation:swing 7s ease-in-out infinite}
      .f1{animation:float 7s ease-in-out infinite}.f2{animation:float 9s ease-in-out infinite 1s}.f3{animation:float 8s ease-in-out infinite 2s}
    </style>
  </defs>
  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <g fill="#ffffff" opacity=".5">
    <circle class="f1" cx="640" cy="60" r="2"/><circle class="f2" cx="720" cy="350" r="1.6"/><circle class="f3" cx="1130" cy="70" r="2.2"/>
    <circle class="f2" cx="820" cy="40" r="1.4"/><circle class="f1" cx="1150" cy="330" r="1.8"/><circle class="f3" cx="560" cy="380" r="1.5"/>
  </g>
  <text x="1105" y="395" class="mono" font-size="120" fill="#ffffff" opacity=".05" text-anchor="end">&lt;/&gt;</text>
  <circle cx="960" cy="210" r="190" fill="url(#glow)"/>
  <!-- balança -->
  <g fill="none" stroke="#d9b26a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" >
    <path d="M875.0 367.0H1045.0"/>
    <path d="M900.0 355.0L928.0 331.0H992.0L1020.0 355.0Z" fill="#d9b26a" fill-opacity=".14"/>
    <path d="M960.0 331.0V107.0" stroke-width="6"/>
    <circle cx="960.0" cy="93.0" r="12.0" fill="#d9b26a" fill-opacity=".25"/>
    <g class="beam" style="transform-origin:960.0px 120.0px">
      <path d="M835.0 120.0H1085.0" stroke-width="5"/>
      
    <path d="M840.0 120.0L792.0 223.0M840.0 120.0L888.0 223.0" stroke-width="2.2"/>
    <circle cx="840.0" cy="120.0" r="5.0" fill="#d9b26a" stroke="none"/>
    <path d="M782.0 223.0H898.0Q840.0 281.0 782.0 223.0Z" fill="#d9b26a" fill-opacity=".18"/>
    <path d="M1080.0 120.0L1032.0 223.0M1080.0 120.0L1128.0 223.0" stroke-width="2.2"/>
    <circle cx="1080.0" cy="120.0" r="5.0" fill="#d9b26a" stroke="none"/>
    <path d="M1022.0 223.0H1138.0Q1080.0 281.0 1022.0 223.0Z" fill="#d9b26a" fill-opacity=".18"/>
      <circle cx="960.0" cy="120.0" r="9.0" fill="#d9b26a" stroke="none"/>
    </g></g>
  <g class="t">
    <rect x="60" y="56" width="236" height="34" rx="17" fill="#f3d58f" fill-opacity=".14" stroke="#f3d58f" stroke-opacity=".5"/>
    <text x="178" y="79" font-size="15" font-weight="600" letter-spacing="2" fill="#f3d58f" text-anchor="middle">DIREITO + CÓDIGO</text>
    <text x="60" y="160" font-size="66" font-weight="800" fill="#ffffff">Lucas Barkoski</text>
    <text x="62" y="205" font-size="25" fill="#c9d4e8">Advogado previdenciarista e “metido a dev”</text>
    <text x="62" y="238" font-size="25" fill="#c9d4e8">nas horas vagas.</text>
  </g>
  <g class="mono" font-size="20">
    <rect x="60" y="275" width="560" height="52" rx="12" fill="#0b1220" fill-opacity=".7" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="82" y="308" fill="#7ee0b8">❯</text>
    <text x="108" y="308" fill="#e6ecf7">conferindo a prova antes da tese</text>
    <rect class="cur" x="500" y="291" width="12" height="22" fill="#f3d58f"/>
  </g>
  <g class="t" font-size="15" font-weight="600">
    <rect x="60" y="348" width="168" height="32" rx="16" fill="#638b83"/><text x="144" y="369" fill="#fff" text-anchor="middle">Previdenciário</text>
    <rect x="240" y="348" width="128" height="32" rx="16" fill="#617da0"/><text x="304" y="369" fill="#fff" text-anchor="middle">IA aplicada</text>
    <rect x="380" y="348" width="96" height="32" rx="16" fill="#74839b"/><text x="428" y="369" fill="#fff" text-anchor="middle">LGPD</text>
    <rect x="488" y="348" width="142" height="32" rx="16" fill="#8a6fb0"/><text x="559" y="369" fill="#fff" text-anchor="middle">Código aberto</text>
  </g>
</svg>
